  /admin/custom_build/create:
    post:
      consumes:
      - application/json
      description: Admin-only build request. The display version and platform are
        user-selected capabilities; provider workflow refs, release identity, and
        dispatch details are resolved server-side.
      parameters:
      - description: Custom-build request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.CustomBuildForm'
      produces:
      - application/json
      responses:
        "200":
          description: Redacted queued custom-build envelope
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.CustomBuildSafe'
              type: object
        "400":
          description: Invalid custom-build request
          schema:
            $ref: '#/definitions/response.Response'
        "412":
          description: Workflow reference approval is required
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Custom build could not be queued
          schema:
            $ref: '#/definitions/response.Response'
        "503":
          description: Build provider or encryption configuration is unavailable
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: Create a custom build
      tags:
      - CustomBuild
  /admin/custom_build/delete:
    post:
      consumes:
      - application/json
      description: Admin-only deletion of a custom-build record and its published
        artifacts.
      parameters:
      - description: Custom-build identifier
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.CustomBuildForm'
      produces:
      - application/json
      responses:
        "200":
          description: Custom build deleted
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Custom build could not be deleted
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: Delete a custom build
      tags:
      - CustomBuild
  /admin/custom_build/download/{id}:
    get:
      description: Admin-only download by build ID. BackendUserAuth and AdminPrivilege
        authorize the request; the build must have a complete immutable publication
        proof. The response is the exact redacted ZIP bytes served by this response,
        not the stored publication output digest and not a signature.
      parameters:
      - description: Completed custom build ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/zip
      responses:
        "200":
          description: Redacted custom-build ZIP archive
          headers:
            Content-Disposition:
              description: Attachment filename
              type: string
            Content-Length:
              description: Exact ZIP response length in bytes
              type: string
            X-DeskForge-Archive-SHA256:
              description: SHA-256 of the exact ZIP bytes served by this response
              type: string
            X-DeskForge-Archive-SHA256-Scope:
              description: Digest scope; distinct from the stored publication digest
              type: string
          schema:
            type: file
        "400":
          description: Invalid build ID
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Administrator authentication or privilege is required
          schema:
            $ref: '#/definitions/response.Response'
        "408":
          description: Download request was cancelled or timed out
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Build completion or output provenance is unavailable
          schema:
            $ref: '#/definitions/response.Response'
        "416":
          description: Range requests are not supported
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: ZIP packaging or validation failed
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - token: []
      summary: Download a completed custom build by ID
      tags:
      - CustomBuild
  /admin/custom_build/list:
    get:
      description: Admin-only paginated list. The response uses the redacted CustomBuildSafeList
        view; provider credentials and storage-only identity fields are not serialized.
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Number of builds per page
