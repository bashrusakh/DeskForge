  /oauth/callback:
    get:
      description: Renders the success/failure HTML result pages or redirects to the
        admin OAuth binding/app route. The same handler is registered for all four
        callback aliases below.
      produces:
      - text/html
      responses:
        "200":
          description: Rendered OAuth success or failure HTML page
          schema:
            type: string
        "302":
          description: Redirect to the admin OAuth binding or app route
          headers:
            Location:
              description: Admin OAuth binding or app redirect target
              type: string
          schema:
            type: string
      summary: Handle the OIDC provider callback
      tags:
