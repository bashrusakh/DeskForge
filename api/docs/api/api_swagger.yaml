  /oidc/auth:
    post:
      consumes:
      - application/json
      description: Starts OIDC authorization and returns the provider URL with the
        state code used by the follow-up query.
      produces:
      - application/json
      responses:
        "200":
          description: Authorization state code and provider URL
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: OIDC authorization could not be started
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Start OIDC authorization
      tags:
      - Oauth
  /oidc/auth-query:
    get:
      description: Exchanges the OIDC state code and provider callback values for
