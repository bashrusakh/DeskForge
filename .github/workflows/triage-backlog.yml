name: Backlog Re-triage

# Thin caller shim for the reusable triage master in bashrusakh/.github, pinned at
# dfd7c61abb095df3ee998f64dddf364922977e3d. The contract is read from THIS repository at
# its default-branch head: the master fetches the contract_files below and fails closed
# if a listed file is missing.
# The permissions are the union the called workflow's jobs require; `issues: write` and
# `pull-requests: write` are the write scopes (plus `actions: read`, `contents: read`).
# Inert until merged: scheduled workflows only run from the default branch.
on:
  schedule:
    # Weekly; the per-repository slot.
    - cron: "21 22 * * 4"
  workflow_dispatch:
    inputs:
      item_numbers:
        description: "Informational comma-separated issue/PR numbers for a manual run, at most 10."
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    uses: bashrusakh/.github/.github/workflows/triage-backlog.lock.yml@dfd7c61abb095df3ee998f64dddf364922977e3d
    secrets:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    with:
      contract_files: "AGENTS.md CONTRIBUTING.md"
      item_numbers: ${{ github.event.inputs.item_numbers }}
