name: Build Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Focused monorepo validation
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: sqlite:///tmp/deskforge-sqlx.sqlite3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: |
            api/go.sum
            go.work.sum
      - name: Go tests and vet
        working-directory: api
        run: |
          go test ./...
          go vet ./...
      - uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2.5.2
        with:
          node-version: 20
      - name: Admin UI build
        working-directory: admin-ui
        run: |
          npm ci
          npm run build
      - run: rustup toolchain install stable --profile minimal
      - run: rustup component add rustfmt --toolchain stable
      - name: Rust format check
        working-directory: server
        run: cargo fmt --all -- --check
      - name: Shared Rust format check
        working-directory: libs/hbb_common
        run: cargo fmt --all -- --check
      - name: Prepare SQLx SQLite schema
        run: |
          python3 - <<'PY'
          import sqlite3

          with sqlite3.connect("/tmp/deskforge-sqlx.sqlite3") as connection:
              connection.executescript(
                  """
                  create table if not exists peer (
                      guid blob primary key not null,
                      id varchar(100) not null,
                      uuid blob not null,
                      pk blob not null,
                      created_at datetime not null default(current_timestamp),
                      user blob,
                      status tinyint,
                      note varchar(300),
                      info text not null
                  ) without rowid;
                  create unique index if not exists index_peer_id on peer (id);
                  create index if not exists index_peer_user on peer (user);
                  create index if not exists index_peer_created_at on peer (created_at);
                  create index if not exists index_peer_status on peer (status);
                  """
              )
          PY
      - name: Rust check
        working-directory: server
        run: cargo check --locked
      - name: Rust tests
        working-directory: server
        run: cargo test --locked
