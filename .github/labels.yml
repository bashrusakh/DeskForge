# Reference label set for repository setup.
# Apply these in GitHub manually, with a label-sync tool, or through the GitHub API.
# Only labels that already exist in this repository are declared here.
- name: bug
  color: d73a4a
  description: Something is not working.
- name: enhancement
  color: a2eeef
  description: New feature or request.
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation.
- name: question
  color: d876e3
  description: Further information is requested.
- name: refactor
  color: c5def5
  description: Internal change with no behavior change.
- name: ci
  color: bfd4f2
  description: CI / build / tooling change.
- name: needs-info
  color: d876e3
  description: More information is needed from the reporter.
- name: confirmed
  color: 0e8a16
  description: The issue has enough evidence to act on.
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists.
