name: Bug report
description: Report a reproducible problem
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Describe the observed problem. Report facts; if you suspect a cause, mark it as a hypothesis.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken, and which area is affected?
      placeholder: A concise description of the problem
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps that reliably demonstrates the problem.
      placeholder: |-
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: Include relevant versions, platform, and affected component when known.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs or other evidence
      description: Add relevant, redacted diagnostic output. Do not include credentials, tokens, or other secrets.
    validations:
      required: false
