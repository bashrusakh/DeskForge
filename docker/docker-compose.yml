networks:
  rustdesk-net:
    external: false

volumes:
  rdgen-data:
  rustdesk-cache:

services:
  rustdesk:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Pass a trusted commit timestamp for deterministic Rust metadata;
        # empty keeps the build deterministic with BUILD_DATE=unknown.
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-}
    ports:
      - 21114:21114
      - 21115:21115
      - 21116:21116
      - 21116:21116/udp
      - 21117:21117
      - 21118:21118
    environment:
      - RELAY=localhost:21117
      - ENCRYPTED_ONLY=N
      - MUST_LOGIN=N
      - TZ=UTC
      - RUSTDESK_API_RUSTDESK_ID_SERVER=localhost:21116
      - RUSTDESK_API_RUSTDESK_RELAY_SERVER=localhost:21117
      - RUSTDESK_API_RUSTDESK_API_SERVER=http://localhost:21114
      - RUSTDESK_API_RUSTDESK_WS_HOST=ws://localhost:21118
      - RUSTDESK_API_KEY_FILE=/data/id_ed25519.pub
      - RUSTDESK_API_JWT_KEY=your-secret-jwt-key-change-this
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:-}
    volumes:
      - ../data/server:/data
      - ../data/api:/app/data
      - rdgen-data:/rdgen-data
    networks:
      - rustdesk-net
    restart: unless-stopped

  # Manual/historical builders only (PLAN.md §3). The active path is provider-backed
  # workflow dispatch for the admitted Windows capability. These containers require
  # `--profile fallback` and are not started by ordinary `docker compose up`.
  # Linux/Android workflow mappings remain disabled until PR11 live evidence closes.
  # MinGW build-win is legacy material retained for historical reference.
  build-linux:
    profiles: ["fallback"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.build-linux
    volumes:
      - rdgen-data:/rdgen-data
      - rustdesk-cache:/rustdesk-cache
    networks:
      - rustdesk-net
    restart: unless-stopped

  build-win:
    profiles: ["fallback"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.build-win
    volumes:
      - rdgen-data:/rdgen-data
      - rustdesk-cache:/rustdesk-cache
    networks:
      - rustdesk-net
    restart: unless-stopped
